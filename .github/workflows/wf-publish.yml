name: Publish Web Forms packages

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-*' # Excludes pre-releases

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for pushing package version tags

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/restore-node

      - name: Publish packages
        run: npm run changeset publish

      - name: Push package version tags
        run: git push origin HEAD:master --follow-tags
